world:
  width: 1000
  height: 1000
  boundary: hard-wall
  boundary_margin: 50
  boundary_repulsion_strength: 1000.0

simulation:
  dt: 0.02
  seed: 42
  num_drones: 100

# A1.2 — Static obstacles [x, y, radius]
# Positioned away from task generation area to avoid visual overlap
obstacles:
  - [150, 850, 40]
  - [850, 150, 35]
  - [100, 500, 45]
  - [900, 500, 55]

# A2.3 — Dynamic (moving) obstacles [x, y, radius, vx, vy]
# Two moving obstacles to test predictive avoidance (A2.2)
dynamic_obstacles:
  - [150, 700, 28, 55,  30]
  - [800, 250, 22, -40, 50]

# A2.4 — Physics tuning (edit while sim is running to hot-reload)
# These mirror config.py but can be overridden here at runtime.
# env.reload_if_changed() picks up changes automatically.
physics:
  edge_sense_radius: 80.0    # A2.5: how far from obstacle surface drones sense it
  edge_strength:     1.6     # A2.5: repulsion multiplier
  pred_lookahead:    8       # A2.2: future timesteps to probe
  pred_k:            0.5     # A2.2: fractional dt per lookahead step
  pred_weight:       1.2     # A2.1: weight of predictive vs edge force